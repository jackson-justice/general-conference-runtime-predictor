[project]
name = "general-conference-runtime-predictor"
version = "0.1.0"
description = "Predicts how long each General Conference talk will run from what is known when the speaker is announced"
readme = "README.md"
authors = [
    { name = "Jackson Justice", email = "jacksonjustice04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "catboost>=1.2.10",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
general-conference-runtime-predictor = "general_conference_runtime_predictor:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
